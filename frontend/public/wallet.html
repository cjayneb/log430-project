<h1>BrokerX - Wallet</h1>
<a href="/orders.html">Orders</a>
<a href="/wallet.html">Wallet</a> |
<a href="/positions.html">Positions</a>
<a href="/" onclick="logout()">Logout</a>
<div id="balance">Loading...</div>
<div id="reserved_funds">Loading...</div>

<form id="fundForm">
    <input type="number" name="amount" placeholder="Add funds" min="1" required>
    <button type="submit">Add Funds</button>
</form>

<script>
    const token = localStorage.getItem('jwt');

    async function loadWallet() {
        const res = await fetch('/api/portfolio/wallet', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const wallet = await res.json();
        document.getElementById('balance').innerText = `Available funds: $${wallet.wallet.available_funds}`;
        document.getElementById('reserved_funds').innerText = `Reserved funds: $${wallet.wallet.reserved_funds}`;
    }

    document.getElementById('fundForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        data.amount = parseFloat(data.amount);
        const res = await fetch('/api/portfolio/wallet/fund', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            loadWallet();
        } else {
            const err = await res.json();
            alert(err.errorMessage || 'Deposit failed');
        }
    };

    loadWallet();
</script>
