services:
  matching-service:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: brokerx_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - brokerx-network

networks:
  brokerx-network:
    driver: bridge
    external: true
