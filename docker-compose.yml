services:
  user-service:
    build:
      context: ./backend/services/user
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - JWT_SECRET=supersecret
    labels:
      - "service=user-service"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://user-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  order-service:
    build:
      context: ./backend/services/order
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - API_GATEWAY_BASE_URL=http://nginx
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - REDIS_ADDR=redis:6379
      - KAFKA_HOST=kafka:9092
      - KAFKA_GROUP_ID=order-group
    labels:
      - "service=order-service"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://order-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  matching-service:
    build:
      context: ./backend/services/matching
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - REDIS_ADDR=redis:6379
      - KAFKA_HOST=kafka:9092
      - KAFKA_GROUP_ID=matching-group
    labels:
      - "service=matching-service"
    depends_on:
      redis:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://matching-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  portfolio-service:
    build:
      context: ./backend/services/portfolio
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - KAFKA_HOST=kafka:9092
      - KAFKA_GROUP_ID=portfolio-group
    labels:
      - "service=portfolio-service"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://portfolio-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  market-data-service:
    build:
      context: ./backend/services/market-data
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - RESOURCES_PATH=resources/
    labels:
      - "service=market-data-service"
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://market-data-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  frontend-service:
    build: ./frontend
    ports:
      - "8081:8081"
    labels:
      - "service=frontend-service"
    depends_on:
      - user-service
      - order-service
      - portfolio-service
    networks:
      - brokerx-network

  db:
    image: mysql:8.0
    container_name: brokerx_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brokerx
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brokerx-network

  locust:
    build:
      context: .
      target: locust
    image: locustio/locust
    container_name: brokerx_locust
    ports:
      - "8089:8089"
    networks:
      - brokerx-network

  redis:
    image: redis:latest
    container_name: brokerx_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - brokerx-network

  kafka:
    image: apache/kafka:latest
    restart: always
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - brokerx-network

  init-kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:9092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic OrderEvents --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic MatchingEvents --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - brokerx-network

  nginx:
    image: nginx:latest
    container_name: brokerx_nginx
    restart: always
    labels:
      - "service=nginx-api-gateway"
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - order-service
      - matching-service
      - portfolio-service
      - market-data-service
    networks:
      - brokerx-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - brokerx-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - brokerx-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - brokerx-network

networks:
  brokerx-network:
    driver: bridge
    external: true

volumes:
  loki_data:
  grafana_data:
