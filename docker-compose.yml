services:
  brokerx:
    build:
      context: .
      target: runtime
    container_name: brokerx_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - FRONTEND_PATH=frontend
      - RESOURCES_PATH=resources/
    networks:
      - brokerx-network
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://brokerx:8080/health"]
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: brokerx_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brokerx
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brokerx-network

  locust:
    build:
      context: .
      target: locust
    image: locustio/locust
    container_name: brokerx_locust
    ports:
      - "8089:8089"
    depends_on:
      - brokerx
    networks:
      - brokerx-network

networks:
  brokerx-network:
    driver: bridge
    external: true
