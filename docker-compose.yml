services:
  user-service:
    build:
      context: ./backend/services/user
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - JWT_SECRET=supersecret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://user-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  order-service:
    build:
      context: ./backend/services/order
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - API_GATEWAY_BASE_URL=http://nginx
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - REDIS_ADDR=redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://order-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  matching-service:
    build:
      context: ./backend/services/matching
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://matching-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  portfolio-service:
    build:
      context: ./backend/services/portfolio
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://portfolio-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  market-data-service:
    build:
      context: ./backend/services/market-data
    expose:
      - "8080"
    environment:
      - APP_PORT=8080
      - RESOURCES_PATH=resources/
    networks:
      - brokerx-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://market-data-service:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

  db:
    image: mysql:8.0
    container_name: brokerx_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brokerx
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brokerx-network

  locust:
    build:
      context: .
      target: locust
    image: locustio/locust
    container_name: brokerx_locust
    ports:
      - "8089:8089"
    networks:
      - brokerx-network

  redis:
    image: redis:latest
    container_name: brokerx_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - brokerx-network

  nginx:
    image: nginx:latest
    container_name: brokerx_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - order-service
      - matching-service
      - portfolio-service
      - market-data-service
    networks:
      - brokerx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - brokerx-network

networks:
  brokerx-network:
    driver: bridge
    external: true

volumes:
  prometheus_data:
