services:
  brokerx:
    build:
      context: .
      target: runtime
    expose:
      - "8080"
      - "6060"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=root:root@tcp(db:3306)/brokerx?parseTime=true
      - REDIS_ADDR=redis:6379
      - FRONTEND_PATH=frontend
      - RESOURCES_PATH=resources/
    networks:
      - brokerx-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://brokerx:8080/health"]
      timeout: 5s
      retries: 5
    deploy:
      replicas: 3

  db:
    image: mysql:8.0
    container_name: brokerx_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brokerx
    ports:
      - "3306:3306"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brokerx-network

  locust:
    build:
      context: .
      target: locust
    image: locustio/locust
    container_name: brokerx_locust
    ports:
      - "8089:8089"
    depends_on:
      - brokerx
    networks:
      - brokerx-network

  redis:
    image: redis:7
    restart: always
    networks:
      - brokerx-network
    container_name: brokerx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - brokerx
    networks:
      - brokerx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - brokerx-network
    depends_on:
      - brokerx

networks:
  brokerx-network:
    driver: bridge
    external: true

volumes:
  prometheus_data:
