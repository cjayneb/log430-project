events {}

http {
  upstream go_backend {
    least_conn;  
    server brokerx:8080;
  }

  upstream user_service {
    least_conn;
    server user-service:8080;
  }

  upstream order_service {
    least_conn;
    server order-service:8080;
  }

  upstream matching_service {
    least_conn;
    server matching-service:8080;
  }

  server {
    listen 80;

    # --- User Service Routes ---
    location /api/user/ {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    ## Internal route used by auth_request to validate token
    location = /auth/verify {
        internal;
        proxy_pass http://user_service/api/user/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Order Service Routes ---
    location /api/order/ {
        auth_request /auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-Id $user_id;
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Matching Service Routes ---
    location /api/matching/ {
        auth_request /auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-Id $user_id;
        proxy_pass http://matching_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Global Routes ---
    location / {
      proxy_pass http://go_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
